# Tiny Tapeout project information
project:
  title:        "3LFCC Digital Controller"      # Project title
  author:       "ORyan-01 / PUCV"               # <-- PON AQUI TU NOMBRE
  discord:      ""                              # <-- TU USUARIO DE DISCORD
  description:  "Controlador PS-PWM con lazo PI en punto fijo para un convertidor Flying Capacitor de 3 niveles, con doble ADC I2C, UART y display OLED"
  language:     "Verilog"
  clock_hz:     27000000                        # 27 MHz, igual que la Tang Nano 20K

  # 1 tile = 167x108 uM.  El diseno tiene ~1500 biestables + ROM de fuente.
  # Empieza en 6x2.  Si el GDS action reporta holgura de sobra, prueba 4x2.
  # Si falla por densidad/congestion, sube a 8x2.
  tiles: "6x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  top_module:  "tt_um_pucv_3lfcc"

  # Source files must be in ./src and you must list each source file separately.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "fcc_core.v"
    - "fcc_fixpt.v"
    - "ps_pwm.v"
    - "signal_generator_0phase.v"
    - "signal_generator_180phase.v"
    - "comparator.v"
    - "dead_time_generator.v"
    - "timer_control.v"
    - "adc.v"
    - "i2c.v"
    - "uart.v"
    - "screen.v"
    - "text.v"
    - "font_rom.v"
    - "toDec.v"
    - "div_u32.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "UART_RX"
  ui[1]: "SCL_OD (0=push-pull, 1=open-drain)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PWM0 (PMOS1)"
  uo[1]: "PWM1 (PMOS2)"
  uo[2]: "PWM2 (NMOS1)"
  uo[3]: "PWM3 (NMOS2)"
  uo[4]: "PWM4 (fijo a 1)"
  uo[5]: "PWM5 (heartbeat 0.5 Hz)"
  uo[6]: "PWM6 (fijo a 0)"
  uo[7]: "PWM7 (fijo a 0)"

  # Bidirectional pins
  uio[0]: "SDA1 - ADS1115 flying cap (open drain)"
  uio[1]: "SDA2 - ADS1115 Vout (open drain)"
  uio[2]: "SCL - reloj I2C comun a los dos ADC"
  uio[3]: "OLED SCLK"
  uio[4]: "OLED SDIN"
  uio[5]: "OLED CS"
  uio[6]: "OLED DC"
  uio[7]: "OLED RES"

# Do not change!
yaml_version: 6
